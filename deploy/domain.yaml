AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFront custom domain for the SnapTask sandbox portal

Parameters:
  CertificateArn:
    Type: String
  DomainName:
    Type: String
    Default: snaptask.dtcdev.click
  HostedZoneId:
    Type: String
    Default: Z05963572WVWFHDQZH5NE
  LambdaFunctionUrlDomain:
    Type: String
    Description: Lambda Function URL domain without protocol or trailing slash.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: SnapTask sandbox portal
        Enabled: true
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        IPV6Enabled: true
        Origins:
          - Id: snaptask-lambda-url
            DomainName: !Ref LambdaFunctionUrlDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: snaptask-lambda-url
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  AliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  AliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SnapTaskUrl:
    Description: Public SnapTask portal URL.
    Value: !Sub https://${DomainName}
  CloudFrontDomainName:
    Description: CloudFront distribution domain.
    Value: !GetAtt Distribution.DomainName
