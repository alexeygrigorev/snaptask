name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.10.11'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m playwright install --with-deps chromium
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked cfn-lint template.yaml deploy/*.yaml
      - run: bash -n deploy/deploy.sh
