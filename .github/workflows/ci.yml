name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r backend/requirements.txt pytest 'moto[dynamodb,s3]' playwright cfn-lint
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - run: cfn-lint template.yaml deploy/*.yaml
      - run: bash -n deploy/deploy.sh
