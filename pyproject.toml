[project]
name = "snaptask"
version = "0.1.0"
description = "Photo tasks for agents through an API and CLI"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35,<2",
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,s3]>=5",
    "playwright>=1.50",
    "cfn-lint>=1",
]

[tool.uv]
package = false
